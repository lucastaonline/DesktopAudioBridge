name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          $name = "DesktopAudioBridge-${{ github.ref_name }}-win-x64-vst3.zip"
          Compress-Archive -Path "build/DesktopAudioBridge_artefacts/Release/VST3/DesktopAudioBridge.vst3" -DestinationPath $name
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" --title "${{ github.ref_name }}" --generate-notes
